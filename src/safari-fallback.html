<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HirePlan - Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            max-width: 400px;
            padding: 2rem;
        }
        .logo {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        .retry-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        .retry-btn:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">HirePlan</div>
        <div class="spinner"></div>
        <div class="message">Loading your dashboard...</div>
        <p style="font-size: 0.9rem; opacity: 0.8;">
            If this takes too long, please try refreshing the page.
        </p>
        <button class="retry-btn" onclick="window.location.reload()">
            Refresh Page
        </button>
    </div>

    <script>
        // Redirect to main app after timeout
        setTimeout(() => {
            if (window.location.pathname === '/safari-fallback.html') {
                window.location.href = '/';
            }
        }, 5000);
        
        // Try to detect if main app loads
        const checkMainApp = setInterval(() => {
            if (document.querySelector('#root')) {
                clearInterval(checkMainApp);
                document.body.style.display = 'none';
            }
        }, 100);
    </script>
</body>
</html>
